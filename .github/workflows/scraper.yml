name: Looker Studio Scraper

on:
  # 1. Atur Jadwal Otomatis (Contoh: Berjalan setiap hari pukul 06.00 UTC)
  # Anda bisa mengubah format Cron sesuai keinginan
  schedule:
    - cron: '0 6 * * *' 

  # 2. Bisa juga dijalankan secara manual dari tab Actions di GitHub
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    # Mengambil kode dari repository Anda
    - name: Checkout repository
      uses: actions/checkout@v4

    # Setup Python di server GitHub
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Instal dependensi (Selenium)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install selenium

    # Jalankan skrip Python Anda
    - name: Run scraper script
      run: python scraper_looker.py

    # (Opsional) Simpan file hasil CSV kembali ke repository otomatis jika ada perubahan
    - name: Commit and push changes if any data updated
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add hasil_looker_data.csv
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update hasil scraping otomatis" && git push)
