name: Looker Studio Scraper

on:
  schedule:
    - cron: '0 6 * * *' 
  workflow_dispatch:

# TAMBAHKAN BLOK INI DI SINI
permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install selenium

    - name: Run scraper script
      run: python scraper_looker.py

    - name: Commit and push changes if any data updated
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add hasil_looker_data.csv
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update hasil scraping otomatis" && git push)
